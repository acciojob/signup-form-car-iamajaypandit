<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<title>Signup Form</title>
</head>
<body>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>
		<h2>Signup Form</h2>
	<form method="psot">
		<!--Name-->
		<label for="name">Name</label>
		<input type="text" id="name"
			name="name"
			placeholder="Name" required> 
		<br>
		<!--Email--> 
			<lable for="Email">Email</lable>
		<input type="email" id="email" placeholder="Email" required/> 
		<!--Gender-->
			<lable for="gender_f">Female</lable> 
		<input type="radio" id="gender_f" name="gender" required/> 
		<!--Car Brands-->
		<lable for="cars">Car Brands</lable> 
		<select id="cars" required> 
			<option value="" disabled selected>-- Please choose an option--</option> 
			<option value="BMW">BMW</option>
			<option value="Mercedes">Mercedes</option>
			<option value="Audi">Audi</option>
		</select> 
		<!--Age-->
		<lable for="age">Age</lable> 
			<input type="number" id="age" placeholder required/>
		<!--DOB-->
		<label for="dob">DOB</label> 
		<input type="date" id="dob" required />
		<!--Phone Number-->
		<lable for="tel">Phone Number</lable>
		<input type="tel" id="tel" placeholder="xxx-xxx-xxxx"/>
		<!-- Password-->
		<lable for="password">Password</lable> 
			<input type="password" id="password" placeholder="Password required"/>
		<!-- TOS Agreement-->
		<label for="tos">I agree to the TOS</label>
		<input type="checkbox" id="tos" required/>
		<!--Submit Button--> 
		<button type="submit">Submit</button>
	</form>

</body>

</html>
